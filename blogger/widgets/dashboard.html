<script type="text/javascript">
  /* ===== CONFIGURAÇÕES DO PERSONAGEM ===== */
  var birthDate = new Date("1994-07-19"); // ANO-MES-DIA
  var pesoKg = 105;   // PESO
  var alturaM = 1.85; // ALTURA
  /* ====================================== */

  var today = new Date();

  var age = today.getFullYear() - birthDate.getFullYear();
  var birthdayThisYear = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());

  if (today < birthdayThisYear) {
    age--;
    birthdayThisYear.setFullYear(today.getFullYear() - 1);
  }

  var nextBirthday = new Date(birthdayThisYear);
  nextBirthday.setFullYear(birthdayThisYear.getFullYear() + 1);

  var xpCurrent = Math.floor((today - birthdayThisYear) / (1000 * 60 * 60 * 24));
  var xpTotal = Math.floor((nextBirthday - birthdayThisYear) / (1000 * 60 * 60 * 24));

  var progress = Math.min((xpCurrent / xpTotal) * 100, 100);

  document.getElementById("levelAge").innerText = "Lv " + age;
  document.getElementById("levelXp").innerText = xpCurrent + " / " + xpTotal + " XP";
  document.getElementById("levelBar").style.width = progress + "%";
  document.getElementById("peso").innerText = pesoKg;
  document.getElementById("altura").innerText = alturaM;

  console.log("[Upskilling] Level Geral carregado");
</script>
